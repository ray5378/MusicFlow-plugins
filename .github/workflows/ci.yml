name: plugin-spec

# 每次 push / PR 自动校验插件是否符合 MusicFlow 插件开发规范:
#   node scripts/check.mjs —— validateManifest 白名单 / __mfPlugin 沙箱契约 /
#   index.js 与 plugin.json 一致 / 每项能力有对应 impl 方法 / downloadUrl tag 与版本匹配。
# 零依赖(纯 Node 内置模块),秒级完成。发布前必须通过(见 README「发布新版本」)。

on:
  push:
    branches: ["master"]
  pull_request:

concurrency:
  group: plugin-spec-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 插件契约校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 校验全部插件(scripts/check.mjs)
        run: node scripts/check.mjs

  no-v2-refs:
    name: 无遗留 V2 项目引用
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验无遗留 V2 项目引用
        run: |
          # 字符类写法(Music[Ff]low / music[Aa]flow)让本文件自身模式文本不被
          # git grep 命中,避免 CI 自检死循环。只拦「项目名层面的 V2 指向」,
          # 不动 ID3v2 / v2.0.0 / mfos_v2 等合法标识。
          if git grep -In -e "Music[Ff]low[-_]V2" -e "music[Aa]flow[-_]v2"; then
            echo "::error::发现遗留的 V2 项目引用,请移除后再提交。"
            exit 1
          fi
          echo "OK: 无 V2 项目引用。"
