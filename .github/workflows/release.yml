name: auto-release

# 自动发版:推送代码到 master → CI 校验(plugin-spec)通过后,自动打包插件并创建
# GitHub Release,无需手动执行 gh release create / upload。
#
# 触发条件:
#   1. master 分支 push(仅 plugins/<id>/ 下文件变更)
#   2. 可手动触发(workflow_dispatch,指定插件 id,多个用空格分隔)
#
# 工作流:
#   1. 从变更路径推断所有变更的插件 id
#   2. 对每个插件依次校验 → 打包 → 创建 Tag + Release

on:
  push:
    branches: ["master"]
    paths:
      - "plugins/go-music-dl/**"
      - "plugins/qq-chart/**"
      - "plugins/kugou-chart/**"
      - "plugins/netease-chart/**"
  workflow_dispatch:
    inputs:
      pluginIds:
        description: "插件 id(多个用空格分隔,如: qq-chart kugou-chart)"
        required: false
        default: ""

concurrency:
  group: auto-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 批量发版
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # 确定待发版插件列表
          INPUT_IDS="${{ github.event.inputs.pluginIds }}"
          if [ -n "$INPUT_IDS" ]; then
            PLUGINS="$INPUT_IDS"
          else
            CHANGED="$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} -- plugins/)"
            PLUGINS="$(echo "$CHANGED" | grep -oP 'plugins/\K[^/]+' | sort -u | tr '\n' ' ')"
          fi
          PLUGINS="$(echo "$PLUGINS" | xargs echo)" # trim

          if [ -z "$PLUGINS" ]; then
            echo "没有检测到插件变更,跳过发版"
            exit 0
          fi
          echo "待发版插件: $PLUGINS"

          for ID in $PLUGINS; do
            echo ""
            echo "=========================================="
            echo "处理插件: $ID"
            echo "=========================================="

            # 校验插件契约
            if [ ! -f "plugins/$ID/plugin.json" ]; then
              echo "跳过 $ID: 缺少 plugin.json"
              continue
            fi
            node scripts/check.mjs "$ID"

            # 读取版本号
            VERSION="$(node -e "process.stdout.write(require('./plugins/$ID/plugin.json').version)")"
            TAG="${ID}-v${VERSION}"
            echo "版本: $ID v$VERSION (tag: $TAG)"

            # 检查 Release 是否已存在
            if gh release view "$TAG" --repo "${{ github.repository }}" &>/dev/null; then
              echo "Release $TAG 已存在,跳过 $ID"
              continue
            fi

            # 打包
            bash scripts/pack.sh "$ID"
            ARCHIVE="dist/$ID.tar.gz"

            # 创建 Tag (如果不存在)
            if ! git tag | grep -q "^${TAG}$"; then
              git config user.name "github-actions"
              git config user.email "github-actions@github.com"
              git tag "$TAG" "${{ github.sha }}"
              git push origin "$TAG"
            fi

            # 生成发布说明
            NOTES="## 变更内容\n\n"
            NOTES+="$(
              git log --oneline --no-decorate "plugins/$ID/" | head -20 | while read line; do
                echo "  - $line"
              done
            )"
            NOTES+="\n\n---\n> 自动发版 by GitHub Actions (CI 校验通过后触发)"

            # 创建 Release
            gh release create "$TAG" \
              --title "$ID v$VERSION" \
              --notes "$NOTES" \
              "$ARCHIVE"

            echo "$ID 发版完成: $TAG"
          done

          echo ""
          echo "全部发版完成"